<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181e36" id="theme-meta">
  <title>Finanças do Casal · Gestão Financeira Inteligente</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanças GFEC">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.jpg">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="manifest" href="./manifest.json">

  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">

  <style>
    /* ==========================================================================
       DESIGN SYSTEM - FINTECH PREMIUM PALETTE (LIGHT & DARK MODE)
       ========================================================================== */
    :root {
      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Light Mode Tokens */
      --bg: #f5f7fb;
      --bg-gradient: radial-gradient(at 0% 0%, #edf1fd 0px, transparent 50%), radial-gradient(at 100% 100%, #f0f3fa 0px, transparent 50%);
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --surface-border: #e2e8f0;
      --surface-glass: rgba(255, 255, 255, 0.85);

      --text: #0f172a;
      --text-muted: #64748b;
      --text-soft: #94a3b8;

      --primary: #4338ca;
      --primary-hover: #3730a3;
      --primary-subtle: #eef2ff;
      --primary-text: #4338ca;

      --emerald: #059669;
      --emerald-subtle: #ecfdf5;
      --emerald-text: #065f46;

      --rose: #e11d48;
      --rose-subtle: #fff1f2;
      --rose-text: #9f1239;

      --amber: #d97706;
      --amber-subtle: #fffbeb;
      --amber-text: #92400e;

      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.03);
      --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.05);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 26px;
      --radius-pill: 9999px;

      --nav-height: 68px;
    }

    [data-theme="dark"] {
      --bg: #0b0f19;
      --bg-gradient: radial-gradient(at 0% 0%, #171d33 0px, transparent 55%), radial-gradient(at 100% 100%, #101424 0px, transparent 50%);
      --surface: #141a29;
      --surface-subtle: #192033;
      --surface-border: #232c45;
      --surface-glass: rgba(20, 26, 41, 0.88);

      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-soft: #64748b;

      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-subtle: rgba(99, 102, 241, 0.15);
      --primary-text: #a5b4fc;

      --emerald: #10b981;
      --emerald-subtle: rgba(16, 185, 129, 0.15);
      --emerald-text: #6ee7b7;

      --rose: #f43f5e;
      --rose-subtle: rgba(244, 63, 94, 0.15);
      --rose-text: #fda4af;

      --amber: #f59e0b;
      --amber-subtle: rgba(245, 158, 11, 0.15);
      --amber-text: #fde68a;

      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 8px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 20px -3px rgba(0, 0, 0, 0.5);
      --shadow-xl: 0 22px 30px -5px rgba(0, 0, 0, 0.6);
    }

    /* ==========================================================================
       RESET & BASE STYLES
       ========================================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Layout Container */
    #app-container {
      max-width: 660px;
      margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 18px calc(var(--nav-height) + 60px + env(safe-area-inset-bottom, 0px));
      position: relative;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
      color: inherit;
      touch-action: manipulation;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input,
    select,
    textarea {
      font-family: inherit;
      font-size: 14.5px;
      width: 100%;
      padding: 13px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--surface-border);
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-subtle);
    }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin: 14px 0 6px;
    }

    /* ==========================================================================
       HEADER & NAVIGATION
       ========================================================================== */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-top: 4px;
    }

    .user-greeting {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.35);
      flex-shrink: 0;
    }

    .user-info h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.4px;
      line-height: 1.2;
    }

    .user-info .subtitle {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    .icon-btn:hover {
      background: var(--surface-subtle);
      transform: translateY(-1px);
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    /* Month Selector Bar */
    .month-selector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 6px 10px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
    }

    .month-selector .label {
      font-weight: 800;
      font-size: 15px;
      text-transform: capitalize;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .month-selector .badge-today {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: var(--radius-pill);
      background: var(--primary-subtle);
      color: var(--primary);
      cursor: pointer;
    }

    .nav-arrow {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      color: var(--text);
    }

    .nav-arrow:hover {
      background: var(--surface-subtle);
    }

    /* Bottom Navigation Bar */
    #bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      display: flex;
      justify-content: center;
      background: var(--surface-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--surface-border);
      padding: 6px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    }

    .nav-inner {
      display: flex;
      width: 100%;
      max-width: 660px;
      justify-content: space-around;
      align-items: center;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 10px;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      position: relative;
      flex: 1;
    }

    .nav-tab.active {
      color: var(--primary);
      font-weight: 700;
    }

    .nav-tab.active svg {
      transform: translateY(-2px);
    }

    .nav-tab svg {
      transition: transform 0.2s;
    }

    /* Floating Action Button (FAB) */
    #fab {
      position: fixed;
      right: 22px;
      bottom: calc(var(--nav-height) + 16px + env(safe-area-inset-bottom, 0px));
      z-index: 45;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 25px -4px rgba(79, 70, 229, 0.5), 0 4px 6px -2px rgba(79, 70, 229, 0.3);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    }

    #fab:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 14px 28px -4px rgba(79, 70, 229, 0.6);
    }

    #fab:active {
      transform: scale(0.95);
    }

    /* ==========================================================================
       HERO CARD & DASHBOARD TILES
       ========================================================================== */
    .hero-card {
      background: linear-gradient(135deg, #1e1b4b 0%, #2e266f 50%, #4338ca 100%);
      color: #ffffff;
      border-radius: var(--radius-xl);
      padding: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 30px -10px rgba(67, 56, 202, 0.35);
      margin-bottom: 20px;
    }

    .hero-card.danger {
      background: linear-gradient(135deg, #4c0519 0%, #881337 50%, #be123c 100%);
      box-shadow: 0 20px 30px -10px rgba(190, 18, 60, 0.35);
    }

    .hero-card::after {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .hero-label {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .hero-status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
    }

    .hero-amount {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1.2px;
      line-height: 1.1;
      margin: 4px 0 10px;
    }

    .hero-subtext {
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-bar-wrap {
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-pill);
      overflow: hidden;
      margin: 16px 0 8px;
    }

    .progress-bar-fill {
      height: 100%;
      background: #ffffff;
      border-radius: var(--radius-pill);
      transition: width 0.5s ease;
    }

    .hero-footer {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 600;
    }

    /* Grid of Quick Metrics */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .metric-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .metric-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .metric-hint {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* Notice / Alert Banners */
    .banner-alert {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 18px;
      font-size: 13.5px;
      line-height: 1.45;
      align-items: flex-start;
    }

    .banner-alert.warning {
      background: var(--amber-subtle);
      border: 1px solid rgba(217, 119, 6, 0.25);
      color: var(--amber-text);
    }

    .banner-alert.danger {
      background: var(--rose-subtle);
      border: 1px solid rgba(225, 29, 72, 0.25);
      color: var(--rose-text);
    }

    .banner-alert.info {
      background: var(--primary-subtle);
      border: 1px solid rgba(99, 102, 241, 0.25);
      color: var(--primary-text);
    }

    .banner-alert b {
      display: block;
      margin-bottom: 2px;
      font-weight: 700;
    }

    /* ==========================================================================
       SECTION HEADERS & LISTS
       ========================================================================== */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 24px 0 12px;
    }

    .section-title {
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-action {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Card List Container */
    .content-box {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 6px 16px;
      box-shadow: var(--shadow-sm);
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--surface-border);
    }

    .item-row:last-child {
      border-bottom: none;
    }

    .category-avatar {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: #fff;
      font-size: 18px;
      box-shadow: var(--shadow-sm);
    }

    .item-main {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-weight: 700;
      font-size: 14.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .item-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
    }

    .badge-primary {
      background: var(--primary-subtle);
      color: var(--primary);
    }

    .badge-emerald {
      background: var(--emerald-subtle);
      color: var(--emerald-text);
    }

    .badge-amber {
      background: var(--amber-subtle);
      color: var(--amber-text);
    }

    .badge-rose {
      background: var(--rose-subtle);
      color: var(--rose-text);
    }

    .badge-gray {
      background: var(--surface-subtle);
      color: var(--text-muted);
      border: 1px solid var(--surface-border);
    }

    .item-values {
      text-align: right;
      flex-shrink: 0;
    }

    .item-price {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.3px;
    }

    .item-subprice {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 4px;
    }

    .action-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      color: var(--text-soft);
      transition: color 0.15s, background 0.15s;
    }

    .action-icon-btn:hover {
      color: var(--text);
      background: var(--surface-subtle);
    }

    .action-icon-btn.danger:hover {
      color: var(--rose);
      background: var(--rose-subtle);
    }

    /* Empty state display */
    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
    }

    .empty-state svg {
      color: var(--text-soft);
      margin-bottom: 12px;
    }

    .empty-state h3 {
      font-size: 16px;
      color: var(--text);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .empty-state p {
      font-size: 13px;
      max-width: 280px;
      margin: 0 auto;
    }

    /* ==========================================================================
       REALISTIC CREDIT CARDS
       ========================================================================== */
    .card-real {
      border-radius: var(--radius-xl);
      padding: 22px;
      color: #ffffff;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card-real:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-xl);
    }

    .card-real-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .card-bank-name {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .emv-chip {
      width: 36px;
      height: 26px;
      background: linear-gradient(135deg, #ffd700, #b8860b);
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      position: relative;
      margin-bottom: 14px;
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.2);
    }

    .card-real-limit {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin: 4px 0 2px;
    }

    .card-real-sublimit {
      font-size: 12.5px;
      opacity: 0.85;
      font-weight: 500;
    }

    .card-real .progress-bar-wrap {
      margin: 14px 0 10px;
      background: rgba(255, 255, 255, 0.25);
    }

    .card-real-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 12px;
      opacity: 0.9;
      font-weight: 600;
      margin-top: 8px;
    }

    .card-best-day {
      display: inline-block;
      background: rgba(255, 255, 255, 0.18);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      font-weight: 700;
    }

    /* ==========================================================================
       PROJECTION 12 MONTH CHART
       ========================================================================== */
    .chart-container {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 20px 16px 14px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .chart-toggle {
      display: flex;
      background: var(--surface-subtle);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-pill);
      padding: 2px;
    }

    .chart-toggle-btn {
      padding: 4px 12px;
      font-size: 11.5px;
      font-weight: 700;
      border-radius: var(--radius-pill);
      color: var(--text-muted);
    }

    .chart-toggle-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .chart-bars-wrap {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 150px;
      padding-top: 20px;
    }

    .chart-col {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;

    /* Mock Client para Modo Demonstração */
    function createMockSeed() {

      const S = "user-samuel", R = "user-rayssa";

    function createMockClient() {
      let state = null;
      try {
        state = JSON.parse(localStorage.getItem("gfec_mock_db") || "null");
      } catch (e) { }
      if (!state) state = createMockSeed();

      const persist = () => {
        try { localStorage.setItem("gfec_mock_db", JSON.stringify(state)); } catch (e) { }
      };

      const currentUser = () => state.users.find(u => u.id === state.session) || null;
      const listeners = [];
      const notify = ev => {
        const u = currentUser();
        listeners.forEach(cb => cb(ev, u ? { user: { id: u.id, email: u.email } } : null));
      };

      const genId = () => "id_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const myId = () => currentUser()?.id;

      const canRead = {
        profiles: () => true,
        cards: r => !r.owner || r.owner === myId(),
        purchases: r => r.user_id === myId() || r.resp === "ambos",
        incomes: r => r.user_id === myId(),
        acertos: () => true
      };

      const canWrite = {
        profiles: r => r.id === myId(),
        cards: r => !r.owner || r.owner === myId(),
        purchases: r => r.user_id === myId(),
        incomes: r => r.user_id === myId(),
        acertos: () => true
      };

      return {
        auth: {
          async signInWithPassword({ email, password }) {
            const u = state.users.find(x => x.email === String(email).trim().toLowerCase() && x.pw === password);
            if (!u) return { error: { message: "E-mail ou senha incorretos." } };
            state.session = u.id;
            persist();
            notify("SIGNED_IN");
            return { data: {}, error: null };
          },
          async signUp({ email, password }) {
            const em = String(email).trim().toLowerCase();
            if (!em || String(password).length < 6) return { error: { message: "Informe um usuário/e-mail e senha com pelo menos 6 caracteres." } };
            if (state.users.some(x => x.email === em)) return { error: { message: "Este usuário/e-mail já está em uso." } };
            const uid = genId();
            state.users.push({ id: uid, email: em, pw: password });
            state.session = uid;
            persist();
            notify("SIGNED_IN");
            return { data: { user: { id: uid, email: em }, session: { user: { id: uid, email: em } } }, error: null };
          },
          async signOut() {
            state.session = null;
            persist();
            notify("SIGNED_OUT");
            return { error: null };
          },
          onAuthStateChange(cb) {
            listeners.push(cb);
            setTimeout(() => {
              const u = currentUser();
              cb("INITIAL_SESSION", u ? { user: { id: u.id, email: u.email } } : null);
            }, 0);
            return { data: { subscription: { unsubscribe() { } } } };
          }
        },
        from(table) {
          let op = "select", payload = null, filters = [], sortCol = null, isSingle = false;
          const match = r => filters.every(([c, v]) => r[c] === v) && canRead[table](r);

          const exec = () => {
            const rows = state[table] || [];
            if (op === "select") {
              let out = rows.filter(match);
              if (sortCol) out = [...out].sort((a, b) => (a[sortCol[0]] < b[sortCol[0]] ? -1 : 1) * (sortCol[1] ? 1 : -1));
              return isSingle ? { data: out[0] || null, error: null } : { data: out.map(r => ({ ...r })), error: null };
            }
            if (!currentUser()) return { error: { message: "Você não está autenticado." } };
            if (op === "insert") {
              const record = { id: genId(), ...payload };
              if (table === "purchases" || table === "incomes" || table === "acertos") record.user_id = myId();
              if (table === "profiles") record.pct = record.pct ?? 50;
              if (!canWrite[table](record)) return { error: { message: "Permissão negada." } };
              if (table === "acertos") {
                if (rows.some(x => x.mes === record.mes)) return { error: { message: "Mês já acertado." } };
              }
              rows.push(record);
              persist();
              return { data: record, error: null };
            }
            if (op === "update") {
              let hasErr = false;
              rows.filter(match).forEach(r => {
                if (canWrite[table](r)) Object.assign(r, payload);
                else hasErr = true;
              });
              persist();
              return { data: null, error: hasErr ? { message: "Permissão negada para atualizar." } : null };
            }
            if (op === "delete") {
              const toRemove = rows.filter(r => match(r) && canWrite[table](r));
              state[table] = rows.filter(r => !toRemove.includes(r));
              persist();
              return { data: null, error: null };
            }
          };

          const builder = {
            select() { return builder; },
            order(col, opts) { sortCol = [col, !opts || opts.ascending !== false]; return builder; },
            eq(col, val) { filters.push([col, val]); return builder; },
            maybeSingle() { isSingle = true; return builder; },
            insert(p) { op = "insert"; payload = p; return builder; },
            update(p) { op = "update"; payload = p; return builder; },
            delete() { op = "delete"; return builder; },
            then(resolve, reject) { return Promise.resolve().then(exec).then(resolve, reject); }
          };
          return builder;
        }
      };
    }

      if (!container) return;

      const icons = {
        success: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
        error: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`,
        info: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`
      };

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = `${icons[type] || icons.info}<span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-10px)";
        toast.style.transition = "all 0.25s ease";
        setTimeout(() => toast.remove(), 250);

      root.innerHTML = `

    /* ==========================================================================
       LÓGICA DE DADOS & MOTOR DE PARCELAS
       ========================================================================== */
    async function loadData() {
      const query = table => sb.from(table).select("*");
      const [p, c, b, i, a, fam] = await Promise.all([
        query("profiles"),
        query("cards"),
        query("purchases").order("data", { ascending: false }),
        query("incomes"),
        query("acertos"),
        query("families")
      ]);

      const err = [p, c, b, i, a].find(res => res.error);
      if (err) {
        showToast("Erro ao carregar dados: " + err.error.message, "error");
      }

      profilesList = p.data || [];
      cardsList = c.data || [];
      purchasesList = b.data || [];
      incomesList = i.data || [];
      acertosList = a.data || [];

      if (currentUser) {
        myProfile = profilesList.find(x => x.id === currentUser.id) || {
          nome: currentUser.email?.split("@")[0] || "Você",
          pct: 50,
          chave_pix: ""
        };
        myFamilyId = myProfile.family_id || null;
        const famRow = (fam.data || []).find(f => f.id === myFamilyId);
        myFamilyInviteCode = famRow?.invite_code || null;
      }
    }

    async function executeOperation(fn, successMsg = null) {
      closeSheet();
      const { error } = await fn();
      if (error) {
        showToast("Falha na operação: " + error.message, "error");
      } else {
        if (successMsg) showToast(successMsg, "success");
      }
      await loadData();
      renderApp();
    }

    /* Calcula as parcelas de uma compra considerando fechamento/vencimento */
    function generateInstallments(purchase) {
      const card = cardsList.find(c => c.id === purchase.card_id);
      const purchaseDate = new Date(purchase.data + "T12:00:00");
      const baseYearMonth = calcYm(purchaseDate);

      let dueYm = baseYearMonth;
      if (card) {
        // Se a data da compra for posterior ao dia de fechamento, cai no próximo mês
        const monthOffset = purchaseDate.getDate() > card.fechamento ? 1 : 0;
        const closesYm = baseYearMonth + monthOffset;
        // Se o vencimento for menor ou igual ao fechamento, vence no mês seguinte ao fechamento
        dueYm = closesYm + (card.vencimento <= card.fechamento ? 1 : 0);
      }

      const installments = [];
      for (let k = purchase.parcela_atual; k <= purchase.n_parcelas; k++) {
        installments.push({
          ym: dueYm + (k - purchase.parcela_atual),
          installmentIndex: k,
          totalInstallments: purchase.n_parcelas,
          value: Number(purchase.valor_parcela),
          purchase
        });
      }
      return installments;
    }

    const getAllInstallments = () => purchasesList.flatMap(generateInstallments);

    /* Calcula a cota do usuário em uma parcela */
    function calcUserShare(inst) {
      if (inst.purchase.resp === "eu") return inst.value;
      if (inst.purchase.resp === "ambos") return inst.value * (myProfile.pct / 100);
      return 0; // empresa ou a receber
    }

        const items = monthInstallments.filter(p => p.purchase.card_id === card.id);
        const total = items.reduce((acc, p) => acc + p.value, 0);
        return { card, total, count: items.length };
      }).filter(c => c.total > 0);

      const noCardItems = monthInstallments.filter(p => !p.purchase.card_id);
      const noCardTotal = noCardItems.reduce((acc, p) => acc + p.value, 0);

      // Projeção dos próximos 12 meses
      const projectionMonths = Array.from({ length: 12 }, (_, i) => currentYm + i);
      const projectionData = projectionMonths.map(ym => {
        const inThisYm = allInstallments.filter(p => p.ym === ym);
        const value = projectionMode === "share"
          ? inThisYm.reduce((acc, p) => acc + calcUserShare(p), 0)
          : inThisYm.reduce((acc, p) => acc + p.value, 0);
        return { ym, value };

    /* 4. TELA: ACERTO DA CASA (QUEM DEVE A QUEM & RESUMO WHATSAPP) */

      const monthSharedInst = getAllInstallments().filter(p => p.ym === selectedMonthYm && p.purchase.resp === "ambos");
      const totalShared = monthSharedInst.reduce((acc, p) => acc + p.value, 0);

      const paidByMe = monthSharedInst.filter(p => p.purchase.user_id === currentUser.id).reduce((acc, p) => acc + p.value, 0);
      const partnerProfile = profilesList.find(p => p.id !== currentUser.id);
      const partnerName = partnerProfile?.nome || "Parceiro(a)";
      const paidByPartner = totalShared - paidByMe;

      const myShareCalculated = totalShared * (myProfile.pct / 100);
      const splitBalance = paidByMe - myShareCalculated; // positivo = parceiro deve a mim; negativo = eu devo a ele
      const isSettled = acertosList.some(a => a.mes === ymString(selectedMonthYm));
      const isEven = Math.abs(splitBalance) < 0.01;

      // Proporções para a barra visual
      const myPctOfPaid = totalShared > 0 ? (paidByMe / totalShared) * 100 : 50;
      const partnerPctOfPaid = 100 - myPctOfPaid;

      return `
        <!-- Acerto Hero Card -->
        <div class="split-hero">
          <div class="split-status-header">
            <span class="split-title">Divisão de Contas · ${ymFullLabel(selectedMonthYm)}</span>
            <span class="badge ${isSettled ? 'badge-emerald' : 'badge-amber'}">
              ${isSettled ? '✓ Acerto Fechado' : '○ Em Aberto'}

          </div>

          <div class="split-big-amount">
            ${isEven ? 'Tudo Quitado!' : formatBRL(Math.abs(splitBalance))}
          </div>

          <div class="split-resolution">
            ${isEven
          ? 'Nenhum dos dois deve nada neste mês.'
          : splitBalance > 0
            ? `<span style="color:var(--emerald); font-weight:700;">${escapeHtml(partnerName)}</span> deve transferir para você`
            : `Você deve transferir para <span style="color:var(--rose); font-weight:700;">${escapeHtml(partnerName)}</span>`
        }
          </div>

          <!-- Barra de Comparação Visual -->
          <div class="split-comparison-bar">
            <div class="split-seg-you" style="width: ${myPctOfPaid}%;"></div>
            <div class="split-seg-partner" style="width: ${partnerPctOfPaid}%;"></div>
          </div>

          <div class="split-legend">
            <span>Você pagou: ${formatBRL(paidByMe)} (${Math.round(myPctOfPaid)}%)</span>
            <span>${escapeHtml(partnerName)} pagou: ${formatBRL(paidByPartner)} (${Math.round(partnerPctOfPaid)}%)</span>

          <div class="split-actions">
            <button class="btn btn-whatsapp" id="btn-share-whatsapp">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
              Copiar Resumo para WhatsApp
            </button>
            <button class="btn btn-secondary" id="btn-toggle-acerto">
              ${isSettled ? 'Reabrir Acerto deste Mês' : '✓ Marcar Mês como Acertado'}
            </button>
          </div>
        </div>

        <!-- Regra de Porcentagem do Usuário -->
        <div class="content-box" style="padding: 16px; margin-bottom: 20px;">
          <div class="section-title" style="margin-bottom: 6px; font-size: 15px;">Sua Porcentagem na Divisão</div>
          <p style="font-size: 12.5px; color: var(--text-muted); margin-bottom: 12px;">
            Ajuste a proporção com a qual você contribui nas despesas conjuntas da casa.
          </p>
          <div style="display:flex; gap:10px; align-items:center;">
            <input type="number" id="input-split-pct" min="0" max="100" value="${myProfile.pct}" style="max-width: 100px;">
            <span style="font-weight: 700;">%</span>
            <button class="btn btn-secondary" id="btn-save-split-pct" style="width: auto; padding: 12px 18px;">Salvar Proporção</button>
          </div>
        </div>

        <!-- Lista de Despesas Compartilhadas -->
        <div class="section-header">
          <div class="section-title">Despesas Compartilhadas (${monthSharedInst.length})</div>
        </div>

        ${monthSharedInst.length > 0 ? `
          <div class="content-box">
            ${monthSharedInst.map(item => {
          const cat = getCat(item.purchase.categoria);
          const payer = profilesList.find(p => p.id === item.purchase.user_id)?.nome || "Parceiro(a)";
          return `
                <div class="item-row">
                  <div class="category-avatar" style="background:${cat.color};">
                    ${cat.icon}
                  </div>
                  <div class="item-main">
                    <div class="item-title">${escapeHtml(item.purchase.descricao)}</div>
                    <div class="item-meta">
                      <span>Pago por: <b>${escapeHtml(payer)}</b></span>
                      <span>· Parcela ${item.installmentIndex}/${item.totalInstallments}</span>

                  </div>
                  <div class="item-values">
                    <div class="item-price">${formatBRL(item.value)}</div>
                    <div class="item-subprice">Sua parte: ${formatBRL(item.value * (myProfile.pct / 100))}</div>
                  </div>
                </div>
              `;
        }).join("")}
          </div>
        ` : `
          <div class="content-box empty-state">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>

          </div>

    /* 5. TELA: CARTÕES DE CRÉDITO */
    function renderCardsView() {

      return `
        <div class="section-header" style="margin-top: 4px;">

        ${cardsList.length > 0 ? `
          <div>
            ${cardsList.map(card => {
        const cardInst = allUpcomingInst.filter(p => p.purchase.card_id === card.id);
        const usedLimit = cardInst.reduce((acc, p) => acc + p.value, 0);
        const availableLimit = Math.max(0, card.limite - usedLimit);
        const usedPct = card.limite > 0 ? Math.min(100, (usedLimit / card.limite) * 100) : 0;
        const theme = CARD_THEMES[card.cor] || CARD_THEMES.indigo;
        const canEdit = !card.owner || card.owner === currentUser.id;

        // Melhor dia para comprar (1 dia após o fechamento)
        const bestDay = card.fechamento === 31 ? 1 : card.fechamento + 1;

        return `
                <div class="card-real" style="background: ${theme.bg};">
                  <div class="card-real-top">
                    <div class="card-bank-name">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                      ${escapeHtml(card.nome)}

                        ${card.owner ? 'Pessoal' : 'Casa'}
                      </span>
                    </div>

                    ${canEdit ? `
                      <div class="item-actions">
                        <button class="action-icon-btn" style="color:#fff;" onclick="openSheet('card', '${card.id}')" title="Editar">
                          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                        </button>
                        <button class="action-icon-btn" style="color:#fff;" onclick="promptDelete('cards', '${card.id}', '${escapeHtml(card.nome)}')" title="Excluir">
                          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                      </div>
                    ` : ''}

                  <div class="emv-chip"></div>

                  <div class="card-real-sublimit">Limite disponível</div>
                  <div class="card-real-limit">${formatBRL(availableLimit)}</div>

                  <div class="progress-bar-wrap">
                    <div class="progress-bar-fill" style="width: ${usedPct}%; background: #ffffff;"></div>
                  </div>

                  <div class="card-real-footer">
                    <div>
                      <span>Usado: ${formatBRL(usedLimit)} de ${formatBRL(card.limite)}</span>
                      <div style="font-size: 11px; opacity:0.85; margin-top:2px;">Fecha dia ${card.fechamento} · Vence dia ${card.vencimento}</div>
                    </div>
                    <div class="card-best-day">
                      Melhor compra: dia ${bestDay}
                    </div>
                  </div>
                </div>
              `;
      }).join("")}
          </div>
        ` : `
          <div class="content-box empty-state">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            <h3>Nenhum cartão cadastrado</h3>
            <p>Cadastre seus cartões para controlar limites e simular o fechamento correto de cada fatura.</p>
          </div>
        `}
      `;
    }

    /* 6. TELA: RECEITAS (PRIVADO) */

      // Header com Saudação e Controles

      const html = `
        <header class="top-header">

        }[currentTab]()}

    /* Troca de aba */
    function switchTab(tabId) {
      currentTab = tabId;
      window.scrollTo(0, 0);
      renderApp();

    function selectMonth(ym) {
      selectedMonthYm = ym;
      renderApp();

    /* ==========================================================================
       MODAIS E FORMULÁRIOS DINÂMICOS (BOTTOM SHEETS)
       ========================================================================== */
    let currentEditingId = null;

    function openSheet(type, editId = null) {
      currentEditingId = editId;
      const root = $("#sheet-root");

      if (type === "menu") {
        root.innerHTML = `
          <div class="overlay-backdrop" id="sheet-overlay">
            <div class="bottom-sheet">
              <div class="sheet-handle"></div>
              <div class="sheet-header">
                <div class="sheet-title">Novo Lançamento</div>
                <button class="action-icon-btn" onclick="closeSheet()">✕</button>
              </div>

              <button class="sheet-menu-opt" onclick="openSheet('buy')">
                <div class="menu-opt-icon" style="background: linear-gradient(135deg, #4f46e5, #7c3aed);">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line></svg>
                </div>
                <div class="menu-opt-info">
                  <b>Compra ou Despesa</b>
                  <span>À vista ou parcelada, no cartão ou fora dele</span>
                </div>
              </button>

              <button class="sheet-menu-opt" onclick="openSheet('inc')">
                <div class="menu-opt-icon" style="background: linear-gradient(135deg, #059669, #10b981);">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                </div>
                <div class="menu-opt-info">
                  <b>Receita / Salário</b>
                  <span>Entrada fixa mensal ou extra esporádica (privado)</span>
                </div>
              </button>

              <button class="sheet-menu-opt" onclick="openSheet('card')">
                <div class="menu-opt-icon" style="background: linear-gradient(135deg, #0f172a, #334155);">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                </div>
                <div class="menu-opt-info">
                  <b>Cartão de Crédito</b>
                  <span>Configurar limite, fechamento e vencimento</span>
                </div>
              </button>
            </div>
          </div>
        `;
        bindSheetOverlayEvents();
        return;
      }

      if (type === "buy") {
        const item = editId ? purchasesList.find(b => b.id === editId) : null;
        const selectedCat = item?.categoria || "Alimentação";
        const todayStr = new Date().toISOString().slice(0, 10);

        root.innerHTML = `
          <div class="overlay-backdrop" id="sheet-overlay">
            <div class="bottom-sheet">
              <div class="sheet-handle"></div>
              <div class="sheet-header">
                <div class="sheet-title">${item ? 'Editar Compra' : 'Nova Compra ou Despesa'}</div>
                <button class="action-icon-btn" onclick="closeSheet()">✕</button>
              </div>

              <label for="f-desc">O que você comprou?</label>
              <input type="text" id="f-desc" placeholder="Ex: Geladeira, Supermercado, Almoço..." value="${escapeHtml(item?.descricao || '')}" maxlength="80">

              <label>Categoria</label>
              <div class="cat-selector-grid">
                ${CATEGORIES.map(c => `
                  <button type="button" class="cat-btn ${selectedCat === c.id ? 'selected' : ''}" data-cat="${c.id}">
                    <span style="font-size: 16px;">${c.icon}</span>
                    <span>${c.id}</span>
                  </button>
                `).join("")}
              </div>
              <input type="hidden" id="f-cat" value="${selectedCat}">

              <div class="input-grid-2">
                <div>
                  <label for="f-val">Valor da parcela (R$)</label>
                  <input type="number" id="f-val" inputmode="decimal" step="0.01" min="0.01" placeholder="0,00" value="${item ? item.valor_parcela : ''}">
                </div>
                <div>
                  <label for="f-date">Data da compra</label>
                  <input type="date" id="f-date" value="${item ? item.data : todayStr}">
                </div>
              </div>

              <div class="input-grid-2">
                <div>
                  <label for="f-tot-inst">Total de Parcelas</label>
                  <input type="number" id="f-tot-inst" inputmode="numeric" min="1" value="${item ? item.n_parcelas : 1}">
                </div>
                <div>
                  <label for="f-cur-inst">Parcela Atual</label>
                  <input type="number" id="f-cur-inst" inputmode="numeric" min="1" value="${item ? item.parcela_atual : 1}">
                </div>
              </div>

              <label for="f-card">Cartão Utilizado</label>
              <select id="f-card">
                <option value="">Sem cartão (Dinheiro / Pix à vista)</option>
                ${cardsList.map(c => `
                  <option value="${c.id}" ${item && item.card_id === c.id ? 'selected' : ''}>${escapeHtml(c.nome)} (Vence dia ${c.vencimento})</option>
                `).join("")}
              </select>

              <label for="f-resp">Quem é o responsável por pagar?</label>
              <select id="f-resp">
                <option value="ambos" ${!item || item.resp === 'ambos' ? 'selected' : ''}>Casa (dividido entre os dois)</option>
                <option value="eu" ${item && item.resp === 'eu' ? 'selected' : ''}>Só meu (despesa pessoal)</option>
                <option value="empresa" ${item && item.resp === 'empresa' ? 'selected' : ''}>Empresa / PJ (a reembolsar)</option>
                <option value="receber" ${item && item.resp === 'receber' ? 'selected' : ''}>A Receber (terceiro me deve)</option>
              </select>

              <div class="form-error" id="form-error"></div>

              <button class="btn btn-primary" id="btn-save-buy" style="margin-top: 14px;">
                ${item ? 'Salvar Alterações' : 'Lançar Compra'}
              </button>
            </div>
          </div>
        `;
        bindSheetOverlayEvents();

        // Seletor de Categoria
        document.querySelectorAll(".cat-btn").forEach(btn => {
          btn.onclick = () => {
            document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            $("#f-cat").value = btn.dataset.cat;
          };
        });

        $("#btn-save-buy").onclick = () => {
          const desc = $("#f-desc").value.trim();
          const val = Number($("#f-val").value);
          const date = $("#f-date").value;
          const totInst = Number($("#f-tot-inst").value);
          const curInst = Number($("#f-cur-inst").value);
          const cardId = $("#f-card").value || null;
          const resp = $("#f-resp").value;
          const cat = $("#f-cat").value;

          const errEl = $("#form-error");
          if (!desc) { errEl.textContent = "Informe a descrição da compra."; return; }
          if (!(val > 0)) { errEl.textContent = "Informe um valor de parcela válido maior que zero."; return; }
          if (!date) { errEl.textContent = "Informe a data da compra."; return; }
          if (curInst > totInst) { errEl.textContent = "A parcela atual não pode ser maior que o total de parcelas."; return; }

          const payload = {
            family_id: myFamilyId,
            descricao: desc,
            valor_parcela: val,
            data: date,
            n_parcelas: totInst,
            parcela_atual: curInst,
            card_id: cardId,
            resp,
            categoria: cat
          };

          if (editId) {
            executeOperation(() => sb.from("purchases").update(payload).eq("id", editId), "Compra atualizada com sucesso!");
          } else {
            executeOperation(() => sb.from("purchases").insert(payload), "Compra lançada com sucesso!");
          }
        };
        return;
      }

      if (type === "card") {
        const card = editId ? cardsList.find(c => c.id === editId) : null;

        root.innerHTML = `
          <div class="overlay-backdrop" id="sheet-overlay">
            <div class="bottom-sheet">
              <div class="sheet-handle"></div>
              <div class="sheet-header">
                <div class="sheet-title">${card ? 'Editar Cartão' : 'Novo Cartão de Crédito'}</div>
                <button class="action-icon-btn" onclick="closeSheet()">✕</button>
              </div>

              <label for="c-name">Nome do Cartão</label>
              <input type="text" id="c-name" placeholder="Ex: Nubank, Inter, XP Infinite..." value="${escapeHtml(card?.nome || '')}" maxlength="60">

              <div class="input-grid-2">
                <div>
                  <label for="c-owner">De quem é?</label>
                  <select id="c-owner">
                    <option value="eu" ${card?.owner ? 'selected' : ''}>Pessoal (só meu)</option>
                    <option value="casa" ${card && !card.owner ? 'selected' : ''}>Compartilhado (da Casa)</option>
                  </select>
                </div>
                <div>
                  <label for="c-limit">Limite Total (R$)</label>
                  <input type="number" id="c-limit" inputmode="decimal" step="0.01" min="0" placeholder="0,00" value="${card ? card.limite : ''}">
                </div>
              </div>

              <div class="input-grid-2">
                <div>
                  <label for="c-close">Dia de Fechamento</label>
                  <input type="number" id="c-close" inputmode="numeric" min="1" max="31" placeholder="Ex: 5" value="${card ? card.fechamento : ''}">
                </div>
                <div>
                  <label for="c-due">Dia de Vencimento</label>
                  <input type="number" id="c-due" inputmode="numeric" min="1" max="31" placeholder="Ex: 12" value="${card ? card.vencimento : ''}">
                </div>
              </div>

              <label for="c-color">Estilo Visual do Cartão</label>
              <select id="c-color">
                ${Object.entries(CARD_THEMES).map(([k, v]) => `
                  <option value="${k}" ${card && card.cor === k ? 'selected' : ''}>${v.name}</option>
                `).join("")}
              </select>

              <div class="form-error" id="form-error"></div>

              <button class="btn btn-primary" id="btn-save-card" style="margin-top: 14px;">
                ${card ? 'Salvar Alterações' : 'Cadastrar Cartão'}
              </button>
            </div>
          </div>
        `;
        bindSheetOverlayEvents();

        $("#btn-save-card").onclick = () => {
          const name = $("#c-name").value.trim();
          const owner = $("#c-owner").value === "eu" ? currentUser.id : null;
          const limit = Number($("#c-limit").value) || 0;
          const closeDay = Number($("#c-close").value);
          const dueDay = Number($("#c-due").value);
          const color = $("#c-color").value;

          const errEl = $("#form-error");
          if (!name) { errEl.textContent = "Dê um nome ao cartão."; return; }
          if (!(closeDay >= 1 && closeDay <= 31 && dueDay >= 1 && dueDay <= 31)) {
            errEl.textContent = "Os dias de fechamento e vencimento devem ser entre 1 e 31.";
            return;
          }

          const payload = {
            family_id: myFamilyId,
            nome: name,
            owner,
            limite: limit,
            fechamento: closeDay,
            vencimento: dueDay,
            cor: color
          };

          if (editId) {
            executeOperation(() => sb.from("cards").update(payload).eq("id", editId), "Cartão atualizado!");
          } else {
            executeOperation(() => sb.from("cards").insert(payload), "Cartão cadastrado!");
          }
        };
        return;
      }

      if (type === "inc") {
        root.innerHTML = `
          <div class="overlay-backdrop" id="sheet-overlay">
            <div class="bottom-sheet">
              <div class="sheet-handle"></div>
              <div class="sheet-header">
                <div class="sheet-title">Nova Receita / Entrada</div>
                <button class="action-icon-btn" onclick="closeSheet()">✕</button>
              </div>

              <label for="i-tipo">Tipo de Entrada</label>
              <select id="i-tipo">
                <option value="Salário Principal">Salário Principal</option>
                <option value="Freelance / Consultoria">Freelance / Consultoria</option>
                <option value="Comissão / Bônus">Comissão / Bônus</option>
                <option value="Rendimento / Investimentos">Rendimento / Investimentos</option>
                <option value="Outra Receita">Outra Receita</option>
              </select>

              <div class="input-grid-2">
                <div>
                  <label for="i-val">Valor (R$)</label>
                  <input type="number" id="i-val" inputmode="decimal" step="0.01" min="0.01" placeholder="0,00">
                </div>
                <div>
                  <label for="i-fixo">Recorrência</label>
                  <select id="i-fixo">
                    <option value="1">Fixo todo mês</option>
                    <option value="0">Variável (só num mês)</option>
                  </select>
                </div>
              </div>

              <div id="i-mes-wrap" style="display: none;">
                <label for="i-mes">Mês de Referência (se variável)</label>
                <input type="month" id="i-mes" value="${ymString(selectedMonthYm)}">
              </div>

              <label for="i-desc">Observação / Detalhes (opcional)</label>
              <input type="text" id="i-desc" placeholder="Ex: Bônus de metas" maxlength="80">

              <div class="form-error" id="form-error"></div>

              <button class="btn btn-primary" id="btn-save-inc" style="margin-top: 14px;">Salvar Receita</button>
            </div>
          </div>
        `;
        bindSheetOverlayEvents();

        $("#i-fixo").onchange = e => {
          $("#i-mes-wrap").style.display = e.target.value === "0" ? "block" : "none";
        };

        $("#btn-save-inc").onclick = () => {
          const val = Number($("#i-val").value);
          const isFixed = $("#i-fixo").value === "1";
          const month = isFixed ? null : $("#i-mes").value;
          const type = $("#i-tipo").value;
          const desc = $("#i-desc").value.trim();

          const errEl = $("#form-error");
          if (!(val > 0)) { errEl.textContent = "Informe um valor de receita válido."; return; }

          const payload = {
            family_id: myFamilyId,
            tipo: type,
            valor: val,
            fixo: isFixed,
            mes: month,
            descricao: desc
          };

          executeOperation(() => sb.from("incomes").insert(payload), "Receita adicionada!");
        };
        return;
      }
    }

    function closeSheet() {
      $("#sheet-root").innerHTML = "";
    }

    function bindSheetOverlayEvents() {
      const overlay = $("#sheet-overlay");
      if (overlay) {
        overlay.onclick = e => {
          if (e.target.id === "sheet-overlay") closeSheet();
        };
      }
    }

    function promptDelete(table, id, itemName) {
      confirmDialog({
        title: "Excluir lançamento",
        text: `Tem certeza que deseja excluir "${itemName}"? Esta ação não pode ser desfeita.`,
        confirmText: "Sim, excluir",
        onConfirm: () => {
          executeOperation(() => sb.from(table).delete().eq("id", id), "Item excluído!");
        }
      });
    }

    /* ==========================================================================
       RESUMO PARA WHATSAPP & EXPORTAÇÕES
       ========================================================================== */
    function generateWhatsAppSummary() {
      const monthSharedInst = getAllInstallments().filter(p => p.ym === selectedMonthYm && p.purchase.resp === "ambos");
      const totalShared = monthSharedInst.reduce((acc, p) => acc + p.value, 0);
      const paidByMe = monthSharedInst.filter(p => p.purchase.user_id === currentUser.id).reduce((acc, p) => acc + p.value, 0);
      const paidByPartner = totalShared - paidByMe;

      const partnerProfile = profilesList.find(p => p.id !== currentUser.id);
      const partnerName = partnerProfile?.nome || "Amor";
      const myName = myProfile?.nome || "Eu";

      const myTheoretical = totalShared * (myProfile.pct / 100);
      const splitBalance = paidByMe - myTheoretical;

      let balanceText = "";
      if (Math.abs(splitBalance) < 0.01) {
        balanceText = "✨ As contas estão perfeitamente quites! Ninguém deve nada.";
      } else if (splitBalance > 0) {
        balanceText = `👉 *${partnerName}* transfere *${formatBRL(splitBalance)}* para *${myName}*`;
        if (myProfile.chave_pix) balanceText += `\n🔑 Chave Pix de ${myName}: *${myProfile.chave_pix}*`;
      } else {
        balanceText = `👉 *${myName}* transfere *${formatBRL(Math.abs(splitBalance))}* para *${partnerName}*`;
        if (partnerProfile?.chave_pix) balanceText += `\n🔑 Chave Pix de ${partnerName}: *${partnerProfile.chave_pix}*`;
      }

      const msg = `📊 *Acerto de Contas da Casa - ${ymFullLabel(selectedMonthYm)}*\n` +
        `━━━━━━━━━━━━━━━━━━━━\n` +
        `🏠 *Total de Despesas da Casa:* ${formatBRL(totalShared)}\n` +
        `👤 *${myName} pagou:* ${formatBRL(paidByMe)}\n` +
        `👤 *${partnerName} pagou:* ${formatBRL(paidByPartner)}\n` +
        `━━━━━━━━━━━━━━━━━━━━\n` +
        `${balanceText}\n\n` +
        `✨ Organizado via *Finanças do Casal*`;

      navigator.clipboard.writeText(msg).then(() => {
        showToast("Resumo copiado! Abra o WhatsApp e cole a mensagem.", "success");
      }).catch(() => {
        prompt("Copie o resumo abaixo:", msg);
      });
    }

    function exportToCSV() {
      const headers = ["Data", "Descrição", "Categoria", "Valor_Parcela", "Parcela_Atual", "Total_Parcelas", "Responsável", "Cartão"];
      const rows = purchasesList.map(b => {
        const card = cardsList.find(c => c.id === b.card_id);
        return [
          b.data,
          `"${(b.descricao || '').replace(/"/g, '""')}"`,
          b.categoria || 'Outros',
          b.valor_parcela,
          b.parcela_atual,
          b.n_parcelas,
          b.resp,
          `"${(card?.nome || 'Sem cartão').replace(/"/g, '""')}"`
        ];
      });

      const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `compras_financas_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("Download do CSV iniciado!", "success");
    }

    function exportToJSON() {
      const data = {
        exported_at: new Date().toISOString(),
        profile: myProfile,
        cards: cardsList,
        purchases: purchasesList,
        incomes: incomesList,
        acertos: acertosList
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `backup_financas_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("Download do Backup JSON iniciado!", "success");
    }

    function normalizeAuthLogin(raw) {
      const str = String(raw || "").trim().toLowerCase();
      if (!str) return "";
      return str.includes("@") ? str : `${str}@gfec.local`;
    }

    function parseAuthError(err) {
      const msg = String(err?.message || err || "");
      if (/confirm|not confirmed/i.test(msg)) {
        return "E-mail não confirmado pelo Supabase. Para retirar essa exigência: no painel do Supabase, acesse 'Authentication' > 'Providers' > 'Email' e desmarque 'Confirm email'.";
      }
      if (/invalid login credentials|invalid credentials/i.test(msg)) {
        return "Usuário ou senha incorretos.";
      }
      if (/already registered/i.test(msg)) {
        return "Este usuário já está cadastrado. Clique em 'Entrar no Sistema' com sua senha.";
      }
      return msg;
    }

    /* ==========================================================================
       VINCULAÇÃO DE EVENTOS DE INTERFACE
       ========================================================================== */
    function bindAuthEvents() {
      const getVal = id => $(`#${id}`)?.value || "";
      const setErr = msg => { const el = $("#auth-error"); if (el) el.textContent = msg; };

      $("#btn-login").onclick = async () => {
        const rawLogin = getVal("auth-email");
        const password = getVal("auth-pw");
        const email = normalizeAuthLogin(rawLogin);
        if (!email || !password) return setErr("Preencha o usuário/e-mail e a senha.");
        setErr("Autenticando...");
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) setErr(parseAuthError(error));
      };

      $("#btn-register").onclick = async () => {
        const rawLogin = getVal("auth-email");
        const password = getVal("auth-pw");
        if (!rawLogin || password.length < 6) return setErr("Preencha o usuário/e-mail e uma senha com 6+ caracteres.");
        const email = normalizeAuthLogin(rawLogin);
        setErr("Criando conta e autenticando...");
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) {
          return setErr(parseAuthError(error));
        }

        // Se a sessão já foi criada diretamente (quando a verificação de e-mail está desligada no Supabase)
        if (data?.session) {
          showToast("Conta criada e conectada com sucesso!", "success");
          return;
        }

        // Tenta login imediato
        const loginRes = await sb.auth.signInWithPassword({ email, password });
        if (loginRes.error) {
          setErr(parseAuthError(loginRes.error));
        } else {
          showToast("Conta criada e conectada com sucesso!", "success");
        }
      };

      $("#btn-test-conn").onclick = async () => {
        setErr("Testando comunicação...");
        try {
          if (isDemoMode) {
            setErr("Modo Demonstração local ativo e funcionando.");
            return;
          }
          const { error } = await sb.from("profiles").select("id").limit(1);
          if (error) throw error;
          setErr("Conexão com o Supabase estabelecida com sucesso!");
        } catch (e) {
          setErr("Falha ao comunicar com o servidor: " + e.message);
        }
      };
    }

    function bindActiveEvents() {
      // Navegação por abas
      document.querySelectorAll("[data-tab]").forEach(btn => {
        btn.onclick = () => switchTab(btn.dataset.tab);
      });

      // FAB
      const fab = $("#fab");
      if (fab) {
        fab.onclick = () => {
          if (currentTab === "buy") openSheet("buy");
          else if (currentTab === "cards") openSheet("card");
          else if (currentTab === "inc") openSheet("inc");
          else openSheet("menu");
        };
      }

      // Alternar Tema (botão no header e nas configurações)
      const toggleTheme = () => {
        currentTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", currentTheme);
        localStorage.setItem("gfec_theme", currentTheme);
        updateThemeMeta();
        renderApp();
      };

      const btnTheme = $("#btn-toggle-theme");
      if (btnTheme) btnTheme.onclick = toggleTheme;
      const btnThemePage = $("#btn-toggle-theme-page");
      if (btnThemePage) btnThemePage.onclick = toggleTheme;

      // Navegação de Mês
      const prevBtn = $("#btn-prev-month");
      if (prevBtn) prevBtn.onclick = () => { selectedMonthYm--; renderApp(); };
      const nextBtn = $("#btn-next-month");
      if (nextBtn) nextBtn.onclick = () => { selectedMonthYm++; renderApp(); };
      const curBtn = $("#btn-current-month");
      if (curBtn) curBtn.onclick = () => { selectedMonthYm = currentYm; renderApp(); };

      // Eventos da Tela de Compras
      const searchInput = $("#buy-search-input");
      if (searchInput) {
        searchInput.oninput = e => {
          searchQuery = e.target.value;
          const container = $("#tab-content");
          if (container && currentTab === "buy") container.innerHTML = renderBuyView();
          // Mantém o foco no input
          const newInp = $("#buy-search-input");
          if (newInp) {
            newInp.focus();
            newInp.setSelectionRange(searchQuery.length, searchQuery.length);
          }
        };
      }

      document.querySelectorAll("[data-resp]").forEach(btn => {
        btn.onclick = () => {
          activeFilterResp = btn.dataset.resp;
          renderApp();
        };
      });

      // Eventos da Tela de Faturas (Toggle de Projeção)
      const btnProjShare = $("#toggle-proj-share");
      if (btnProjShare) {
        btnProjShare.onclick = () => { projectionMode = "share"; renderApp(); };
      }
      const btnProjTotal = $("#toggle-proj-total");
      if (btnProjTotal) {
        btnProjTotal.onclick = () => { projectionMode = "total"; renderApp(); };
      }

      // Eventos da Tela de Acerto da Casa
      const btnWhatsapp = $("#btn-share-whatsapp");
      if (btnWhatsapp) btnWhatsapp.onclick = generateWhatsAppSummary;

      const btnToggleAcerto = $("#btn-toggle-acerto");
      if (btnToggleAcerto) {
        btnToggleAcerto.onclick = () => {
          const ymKey = ymString(selectedMonthYm);
          const existing = acertosList.find(a => a.mes === ymKey);
          if (existing) {
            // Deleta pelo id da linha (PK nova)
            executeOperation(() => sb.from("acertos").delete().eq("id", existing.id), "Acerto reaberto!");
          } else {
            // Insere com family_id para respeitar RLS
            executeOperation(() => sb.from("acertos").insert({ mes: ymKey, family_id: myFamilyId }), "Acerto marcado como concluído!");
          }
        };
      }

      const btnSaveSplitPct = $("#btn-save-split-pct");
      if (btnSaveSplitPct) {
        btnSaveSplitPct.onclick = () => {
          const val = Math.min(100, Math.max(0, Number($("#input-split-pct").value) || 0));
          executeOperation(() => sb.from("profiles").update({ pct: val }).eq("id", currentUser.id), "Proporção atualizada!");
        };
      }

      // Eventos da Tela de Ajustes
      const btnSaveProfile = $("#btn-save-profile");
      if (btnSaveProfile) {
        btnSaveProfile.onclick = () => {
          const nome = $("#cfg-nome").value.trim();
          const pix = $("#cfg-pix").value.trim();
          const pct = Math.min(100, Math.max(0, Number($("#cfg-pct").value) || 0));

          if (!nome) { showToast("Informe seu nome.", "error"); return; }
          executeOperation(() => sb.from("profiles").update({ nome, chave_pix: pix, pct }).eq("id", currentUser.id), "Perfil atualizado com sucesso!");
        };
      }

      // Copiar código de convite
      const btnCopyInvite = $("#btn-copy-invite");
      if (btnCopyInvite) {
        btnCopyInvite.onclick = () => {
          navigator.clipboard.writeText(myFamilyInviteCode || "").then(() => {
            showToast("Código copiado! Envie para seu parceiro(a).", "success");
          }).catch(() => {
            prompt("Copie o código abaixo:", myFamilyInviteCode);
          });
        };
      }

      // Vincular parceiro(a) pelo código de convite
      const btnJoinFamily = $("#btn-join-family");
      if (btnJoinFamily) {
        btnJoinFamily.onclick = async () => {
          const code = $("#input-invite-code")?.value.trim().toUpperCase();
          const errEl = $("#invite-error");
          if (!code || code.length < 6) {
            if (errEl) errEl.textContent = "Informe o código de convite do seu parceiro(a).";
            return;
          }


          // Busca a família pelo código via RPC (security definer contorna o RLS com segurança)
          const { data: famResult, error: tErr } = await sb.rpc("get_family_by_invite", { code });
          const targetFam = Array.isArray(famResult) ? famResult[0] : famResult;


          if (tErr || !targetFam) {
            if (errEl) errEl.textContent = "Código não encontrado. Verifique e tente novamente.";
            return;
          }

          if (targetFam.id === myFamilyId) {
            if (errEl) errEl.textContent = "Você já pertence a esta família!";
            return;
          }

          // Vincula o usuário à nova família
          const { error: upErr } = await sb.from("profiles").update({ family_id: targetFam.id }).eq("id", currentUser.id);
          if (upErr) {
            if (errEl) errEl.textContent = "Erro ao vincular: " + upErr.message;
            return;
          }

          showToast("Vinculado(a) com sucesso! Bem-vindo ao grupo.", "success");
          await loadData();
          renderApp();
        };
      }

      const btnExportCSV = $("#btn-export-csv");
      if (btnExportCSV) btnExportCSV.onclick = exportToCSV;

      const btnExportJSON = $("#btn-export-json");
      if (btnExportJSON) btnExportJSON.onclick = exportToJSON;

      const btnResetDemo = $("#btn-reset-demo");
      if (btnResetDemo) {
        btnResetDemo.onclick = () => {
          confirmDialog({
            title: "Restaurar Demonstração",
            text: "Deseja resetar o banco de dados local para os dados fictícios originais?",
            confirmText: "Sim, restaurar",
            onConfirm: () => {
              try { localStorage.removeItem("gfec_mock_db"); } catch (e) { }
              location.reload();
            }
          });
        };
      }

      const btnLogout = $("#btn-logout");
      if (btnLogout) {
        btnLogout.onclick = () => {
          confirmDialog({
            title: "Sair da conta",
            text: "Deseja realmente desconectar?",
            confirmText: "Sair",
            onConfirm: () => sb.auth.signOut()
          });
        };
      }
    }

    // Tecla ESC fecha modais
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeSheet();
    });

    /* ==========================================================================
       INICIALIZAÇÃO DO APLICATIVO (BOOTSTRAP)
       ========================================================================== */
    async function initSession(session) {
      currentUser = session?.user || null;
      if (currentUser) {
        // Busca ou cria o perfil do usuário
        let { data: profile } = await sb.from("profiles").select("*").eq("id", currentUser.id).maybeSingle();

        if (!profile) {
          // Novo usuário: cria uma família exclusiva para ele
          const { data: newFamily, error: famErr } = await sb.from("families").insert({}).select().maybeSingle();
          const familyId = newFamily?.id || null;

          const defaultName = currentUser.email?.split("@")[0] || "Usuário";
          await sb.from("profiles").insert({
            id: currentUser.id,
            nome: defaultName,
            pct: 50,
            family_id: familyId
          });
        } else if (!profile.family_id) {
          // Usuário antigo sem família: cria uma para ele
          const { data: newFamily } = await sb.from("families").insert({}).select().maybeSingle();
          if (newFamily) {
            await sb.from("profiles").update({ family_id: newFamily.id }).eq("id", currentUser.id);
          }
        }

        await loadData();
      }
      renderApp();
    }

    if (sb) {
      sb.auth.onAuthStateChange((_event, session) => {
        initSession(session).catch(err => {
          console.error("Erro na inicialização:", err);
          showToast("Erro ao sincronizar sessão: " + err.message, "error");
        });
      });
    }
  </script>
