<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#181e36"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>

  <!-- Card Back -->
  <rect x="110" y="130" width="260" height="160" rx="20" fill="url(#primaryGrad)" opacity="0.6" transform="rotate(-12 240 210)"/>

  <!-- Card Front -->
  <rect x="140" y="160" width="260" height="160" rx="20" fill="url(#primaryGrad)" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))"/>
  <rect x="170" y="200" width="44" height="32" rx="6" fill="#fbbf24" opacity="0.9"/>
  <circle cx="350" cy="270" r="18" fill="#f43f5e" opacity="0.8"/>
  <circle cx="370" cy="270" r="18" fill="#fbbf24" opacity="0.8"/>

  <!-- Heart / Chart Overlay -->
  <path d="M 256 380 C 180 320 150 250 190 200 C 220 160 256 200 256 200 C 256 200 292 160 322 200 C 362 250 332 320 256 380 Z" fill="url(#emeraldGrad)" opacity="0.9" filter="drop-shadow(0 10px 20px rgba(5,150,105,0.4))"/>

  <!-- Growth Arrow -->
  <path d="M 160 410 L 230 350 L 290 380 L 370 290" fill="none" stroke="#6ee7b7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 340 290 H 370 V 320" fill="none" stroke="#6ee7b7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
